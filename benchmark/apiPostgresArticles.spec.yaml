config:
  plugins:
    apdex: {}
    ensure: {}
    metrics-by-endpoint: {}
  apdex:
    threshold: 100
  ensure:
    thresholds:
      - http.response_time.p99: 100
      - http.response_time.p95: 75
  processor: ./benchmark/apiPostgresArticles.processor.mjs
scenarios:
  - name: apiPostgresArticles
    flow:
      - post:
          url: /api/postgres-articles
          beforeRequest: addArticle
          afterResponse: getInsertedId
      - get:
          url: /api/postgres-articles
      - get:
          url: /api/postgres-articles/{{_id}}
      - put:
          url: /api/postgres-articles/{{_id}}
          beforeRequest: editArticle
      - delete:
          url: /api/postgres-articles/{{_id}}
