config:
  plugins:
    apdex: {}
    ensure: {}
    metrics-by-endpoint: {}
  apdex:
    threshold: 100
  ensure:
    thresholds:
      - http.response_time.p99: 100
      - http.response_time.p95: 75
  processor: ./benchmark/api.processor.mjs
scenarios:
  - name: api
    flow:
      - get:
          url: /api/404
