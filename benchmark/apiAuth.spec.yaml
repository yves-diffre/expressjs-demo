config:
  plugins:
    apdex: {}
    ensure: {}
    metrics-by-endpoint: {}
  apdex:
    threshold: 100
  ensure:
    thresholds:
      - http.response_time.p99: 100
      - http.response_time.p95: 75
  processor: ./benchmark/apiAuth.processor.mjs
scenarios:
  - name: apiAuth
    flow:
      - post:
          url: /api/auth/sign-up
          beforeRequest: signUp
      - post:
          url: /api/auth/sign-in
          beforeRequest: signIn
      - post:
          url: /api/auth/sign-out
